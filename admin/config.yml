backend:
  name: github
  repo: girishtare/wanderlustfoodies_v2
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-snowy.vercel.app

media_folder: "assets/img"
public_folder: "../assets/img"

collections:
  - name: "site_data"
    label: "Blog & Recipes"
    files:
      - name: "content"
        label: "Content"
        file: "data.json"
        fields:
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Slug", name: "slug", widget: "string", hint: "URL-safe id, e.g. my-post-title"}
              - {label: "Category", name: "category", widget: "select", options: ["travel", "trek", "story"]}
              - {label: "Category Label", name: "categoryLabel", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Cover Image", name: "image", widget: "image"}
              - {label: "YouTube Video URL", name: "video", widget: "string", required: false, hint: "Paste a full YouTube link, leave blank for none"}
              - {label: "Author", name: "author", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Read Time", name: "readTime", widget: "string"}
              - {label: "Featured", name: "featured", widget: "boolean", default: false}
              - label: "Content Blocks"
                name: "content"
                widget: "list"
                summary: "{{type}}: {{text}}"
                fields:
                  - {label: "Type", name: "type", widget: "select", options: ["lead", "h2", "p", "quote"]}
                  - {label: "Text", name: "text", widget: "text"}
          - label: "Recipes"
            name: "recipes"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Slug", name: "slug", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "YouTube Video URL", name: "video", widget: "string", required: false}
              - {label: "Time", name: "time", widget: "string"}
              - {label: "Serves", name: "serves", widget: "string"}
              - {label: "Difficulty", name: "difficulty", widget: "select", options: ["Easy", "Medium", "Hard"]}
              - {label: "Tags", name: "tags", widget: "list"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Blurb", name: "blurb", widget: "text"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Ingredients", name: "ingredients", widget: "list"}
              - {label: "Method Steps", name: "method", widget: "list"}
              - {label: "Featured", name: "featured", widget: "boolean", default: false}
